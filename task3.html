<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 – Reserve a table</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/task3.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <div class="card cafe-card">
          <div class="card-body p-4 p-md-5">

            <h1 class="h3 mb-4">Reserve a table</h1>

            <form action="#" method="post">
              <div class="row g-3">

                <div class="col-12 col-md-6">
                  <label for="name" class="form-label">Your name</label>
                  <input type="text" class="form-control" id="name" name="name"
                         autocomplete="name" required>
                </div>

                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email"
                         autocomplete="email" placeholder="name@example.com" required>
                </div>

                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone" name="phone"
                         autocomplete="tel" placeholder="+7 701 234 56 78" required>
                </div>

                <div class="col-6 col-md-3">
                  <label for="guests" class="form-label">Guests</label>
                  <input type="number" class="form-control" id="guests" name="guests"
                         min="1" max="12" step="1" value="2" required>
                </div>

                <div class="col-6 col-md-3">
                  <label for="date" class="form-label">Date</label>
                  <input type="date" class="form-control" id="date" name="date" required>
                </div>

                <div class="col-12 col-md-6">
                  <fieldset>
                    <legend class="form-label fs-6">Seating</legend>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="seating" id="seating-inside" value="inside" required>
                      <label class="form-check-label" for="seating-inside">Inside</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="seating" id="seating-terrace" value="terrace">
                      <label class="form-check-label" for="seating-terrace">Terrace</label>
                    </div>
                  </fieldset>
                </div>

                <div class="col-12 col-md-6">
                  <label for="meal" class="form-label">Meal</label>
                  <select class="form-select" id="meal" name="meal">
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="comments" class="form-label">Comments <span class="text-body-secondary">(optional)</span></label>
                  <textarea class="form-control" id="comments" name="comments" rows="3" maxlength="500"></textarea>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" name="terms" value="yes" required>
                    <label class="form-check-label" for="terms">I agree to the terms</label>
                  </div>
                </div>

                <div class="col-12 d-grid d-md-flex justify-content-md-end">
                  <button type="submit" class="btn btn-primary btn-reserve px-5">Reserve</button>
                </div>

              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
